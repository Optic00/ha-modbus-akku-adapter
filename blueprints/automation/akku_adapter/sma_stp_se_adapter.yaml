blueprint:
  name: "SMA STP SE – Modbus Akku-Adapter"
  description: >
    Hardware-Adapter: übersetzt den abstrakten Steuer-Modus (Contract) in
    Modbus-Register-Schreibvorgänge für den SMA STP SE Hybrid-Wechselrichter.

    Unterstützte Modi (über den Modus-Select / Contract):
    Automatisch · Schnell Laden · Schnell Entladen · Pause · Nur Laden · Netzladen · Nur Entladen · Dynamisch · 0.2C Laden


    **Voraussetzung:** ein Modbus-TCP-Hub zum WR (siehe `examples/sma_modbus.example.yaml`),
    ein `input_select` mit dem Modus-Vokabular sowie die Sollwert-/SoC-Helfer aus dem
    Contract (`docs/modus-contract.md`). Die Strategie, die den Modus setzt, ist NICHT
    Teil dieses Adapters.
  domain: automation
  author: Optic00
  input:
    modbus_hub:
      name: Modbus Hub Name
      description: >
        Name des Modbus Hubs, wie in sma_modbus.yaml unter `name:` definiert.
        Standard: sma-sr_wr
      default: "sma-sr_wr"
      selector:
        text:

    inverter_status_sensor:
      name: WR Betriebsstatus-Sensor
      description: >
        Sensor für den Betriebsstatus des Wechselrichters.
        Muss einen Status aus `inverter_ok_states` liefern, damit der Adapter
        Register schreibt (Standard-Vokabular: "Ok").
        Typisch: sensor.sma_stp_se_33003_betriebsstatus
      selector:
        entity:
          domain: sensor

    inverter_ok_states:
      name: "WR-Status: als betriebsbereit akzeptierte Werte"
      description: >
        Liste der Statuswerte von `inverter_status_sensor`, bei denen der
        Adapter Modbus-Register schreibt (inklusive Keepalive). Standard: nur
        "Ok".

        Achtung: eine zu strenge Liste ist gefährlich. Meldet der WR einen
        Status, der hier fehlt (z. B. "2119" = Abregelung wegen der
        70%-Einspeisebegrenzung, oder einen Code, den ein selbstgebauter
        Mapping-Helfer nicht kennt), blockiert das ALLE Läufe dieser
        Automation, auch den Keepalive. Läuft die SMA-Fremdsteuerung dadurch
        in ihren Timeout, fällt der WR in seinen internen Modus zurück und
        lädt/entlädt eigenmächtig - unabhängig vom gewählten Modus. Status-
        Codes wie Abregelung sollten deshalb mit aufgenommen werden, wenn sie
        im eigenen Setup regelmäßig auftreten.
      default:
        - "Ok"
      selector:
        text:
          multiple: true

    dynamic_charge_strength_sensor:
      name: Sensor "Dynamische Ladestärke"
      description: >
        Template-Sensor mit der berechneten dynamischen Ladestärke, in Watt.
        Kanonischer Name bei Nutzung von ha-opti-akkusteuerung:
        sensor.opti_charge_power_w. Bei eigener Strategie: eigenen Watt-Sensor
        eintragen.
      default: sensor.opti_charge_power_w
      selector:
        entity:
          domain: sensor

    battery_capacity_sensor:
      name: Sensor "Batterie-Nennkapazität"
      description: >
        Sensor mit der Nennkapazität der Batterie in Wh (Modbus-Register 40187).
        Wird für den Modus "Akku 0.2C Laden" gebraucht: die Ladeleistung ergibt
        sich automatisch als 0,2 × Kapazität (z. B. 12800 Wh → 2560 W).
      default: sensor.sma_stp_se_40187_batterie_nennkapazitaet
      selector:
        entity:
          domain: sensor

    mode_select:
      name: "Modus-Select (Akkusteuerung)"
      description: >
        input_select mit dem abstrakten Steuer-Modus (Contract). Dieser Adapter
        liest den Modus und übersetzt ihn in SMA-Modbus-Register.
        Standard: input_select.akkusteuerung_modus
      default: input_select.akkusteuerung_modus
      selector:
        entity:
          domain: input_select

    last_write_value_helper:
      name: "Helfer: Letzter Schreibwert (Write-on-Change)"
      description: >
        input_text-Helfer, der den Snapshot der zuletzt geschriebenen BMS-Wertregister
        speichert (40793/40795/40797/40799/40801). Wird vom Adapter automatisch
        gepflegt, nicht manuell setzen. Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_text.akkusteuerung_modbus_letzter_schreibwert
      selector:
        entity:
          domain: input_text

    last_write_time_helper:
      name: "Helfer: Letzter Schreibzeitpunkt (Write-on-Change)"
      description: >
        input_datetime-Helfer (Datum + Uhrzeit), der den Zeitpunkt des letzten
        tatsächlichen BMS-Register-Schreibvorgangs speichert. Wird vom Adapter
        automatisch gepflegt. Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_datetime.akkusteuerung_modbus_letzter_schreibzeitpunkt
      selector:
        entity:
          domain: input_datetime

    keepalive_seconds:
      name: "Keepalive-Intervall (Sekunden)"
      description: >
        Maximales Intervall, nach dem die BMS-Wertregister (40793-40801) auch ohne
        Wertänderung erneut geschrieben werden (sonst läuft die SMA-Fremdsteuerung
        aus). Hersteller-Limit: 300s. Default 180s lässt Sicherheitsmarge.
      default: 180
      selector:
        number:
          min: 30
          max: 200
          step: 10
          unit_of_measurement: s
          mode: box

variables:
  # !input ist in Jinja nicht direkt verfügbar – erst als Variable exponieren.
  inverter_status_entity: !input inverter_status_sensor
  inverter_ok_states: !input inverter_ok_states
  dyn_charge_entity: !input dynamic_charge_strength_sensor
  capacity_entity: !input battery_capacity_sensor
  snapshot_helper: !input last_write_value_helper
  timestamp_helper: !input last_write_time_helper
  keepalive_s: !input keepalive_seconds
  mode_select_entity: !input mode_select
  early_stop_modes: ['Akku Automatisch', 'Akku schnell Laden', 'Akku schnell Entladen']
  # Einschwing-Schutz: nach einem Wechsel IN "Akku Dynamisch" hat der WR beobachtet
  # (2x live reproduziert, 2026-07-01) bis zu ~5 Minuten eine unklare interne
  # Ladeleistungsgrenze (vermutlich Drift auf Maximalwert waehrend "nur Entladen").
  # Deckel die Ladeleistung in diesem Fenster defensiv auf einen sicheren Wert.
  dynamisch_settling_seconds: 330
  dynamisch_settling_cap_w: 500
  dynamisch_settling: >-
    {{ states(mode_select_entity) == 'Akku Dynamisch'
       and (as_timestamp(now()) - as_timestamp(states[mode_select_entity].last_changed)) < dynamisch_settling_seconds }}
  # Im Modus "Akku Netzladen" ist BatChaMinW die erzwungene Mindestladung (volles
  # dynamisches Limit, kein Deckel durch akkusteuerung_min_ladestaerke) - in allen
  # anderen Modi bleibt das bisherige min()-Verhalten unveraendert.
  v_40793_raw: >-
    {{ states(dyn_charge_entity) | int(0) if states(mode_select_entity) == 'Akku Netzladen'
       else ([states('input_number.akkusteuerung_min_ladestaerke') | int(0), states(dyn_charge_entity) | int(0)] | min) }}
  # dynamisch_settling greift nur im Modus "Akku Dynamisch" (siehe Bedingung oben),
  # ist also in "Akku Netzladen" immer False -> v_40793 = v_40793_raw, ungedeckelt.
  # OFFENES RISIKO (bewusst so belassen, siehe Aufgabenstellung): der in v1.3.0
  # behobene Ladeleistungs-Spike trat nach Rueckkehr aus einem "Laden irrelevant"-
  # Modus (nur Entladen) in einen Lademodus auf. "Akku Netzladen" ist ebenfalls
  # ein Ziel-Uebergang aus so einem Modus (z. B. aus "nur Entladen"/"Pause") -
  # der 500W-Settling-Deckel greift hier NICHT. Vor Live-Rollout unbedingt den
  # Uebergang nur Entladen/Pause -> Netzladen auf Spikes testen (siehe Report).

  v_40793: "{{ [v_40793_raw, dynamisch_settling_cap_w] | min if dynamisch_settling else v_40793_raw }}"
  v_40795_raw: "{{ states(dyn_charge_entity) | int(0) }}"
  v_40795: "{{ [v_40795_raw, dynamisch_settling_cap_w] | min if dynamisch_settling else v_40795_raw }}"
  v_40797: "{{ [states('input_number.akkusteuerung_min_entladestaerke') | int(0), states('input_number.akkusteuerung_max_entladestaerke') | int(0)] | min }}"
  v_40799: "{{ states('input_number.akkusteuerung_max_entladestaerke') | int(0) }}"
  # Modus ist Teil des Snapshots: JEDER Moduswechsel macht current_snapshot
  # unterschiedlich zum zuletzt gespeicherten Wert und erzwingt damit einen
  # sofortigen Rewrite der BMS-Wertregister in derselben Ausfuehrung, statt bis
  # zum naechsten Keepalive-Zyklus zu warten (bestaetigte Root-Cause-Komponente).
  current_snapshot: "{{ [v_40793, v_40795, v_40797, v_40799, 0, states(mode_select_entity)] | join('|') }}"
  write_needed: >-
    {% set valid_dt = state_attr(timestamp_helper, 'has_date') and state_attr(timestamp_helper, 'has_time') %}
    {% set last_ts = as_timestamp(states(timestamp_helper), none) if valid_dt else none %}
    {{ trigger.id == 'ha_start'
       or current_snapshot != states(snapshot_helper)
       or last_ts is none
       or (now().timestamp() - last_ts) > (keepalive_s | int(0)) }}

triggers:
  - entity_id:
      - !input mode_select
      - !input dynamic_charge_strength_sensor   # Drosselung sofort übernehmen, nicht erst beim /4-min-Tick
      - input_number.akkusteuerung_entladestaerke_soll
      - input_number.akkusteuerung_ladestaerke_soll
      - input_number.akkusteuerung_min_ladestaerke
      - input_number.akkusteuerung_min_entladestaerke
      - input_number.akkusteuerung_max_ladestaerke
      - input_number.akkusteuerung_max_entladestaerke
    from: null
    to: null
    for:
      seconds: 2
    trigger: state

  - minutes: /4
    trigger: time_pattern

  - minutes: /1
    trigger: time_pattern
    id: keepalive_check

  - event: start
    trigger: homeassistant
    id: ha_start

conditions:
  # WR-Status-Gate: bewusst konfigurierbar statt hart auf "Ok" verdrahtet.
  # Ein zu strenges Gate hier ist gefaehrlich, weil es ALLE Laeufe blockiert,
  # inklusive Keepalive. Meldet der WR einen Status, der nicht in
  # inverter_ok_states steht (z. B. 2119 = Abregelung wegen der
  # 70%-Einspeisebegrenzung, oder ein Code, den ein eigener Mapping-Helfer
  # nicht kennt), schreibt der Adapter so lange keine Register mehr, bis der
  # Status wieder passt. Bleibt das laenger als das SMA-Keepalive-Fenster so,
  # laeuft die externe Fremdsteuerung in ihren Timeout und der WR faellt in
  # seinen internen Modus zurueck - er laedt/entlaedt dann eigenmaechtig,
  # unabhaengig vom in HA gewaehlten Modus (live reproduziert). Status-Codes
  # wie Abregelung sollten deshalb in inverter_ok_states mit aufgenommen
  # werden, wenn sie im eigenen Setup regelmaessig auftreten.
  - condition: template
    value_template: "{{ states(inverter_status_entity) in inverter_ok_states }}"
  - condition: template
    value_template: >-
      {{ trigger.id != 'keepalive_check'
         or (states(mode_select_entity) not in early_stop_modes and write_needed) }}

actions:
  - alias: Wenn Akku Automatik
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Automatisch"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 803
        action: modbus.write_register
      - stop: ""

  - alias: Wenn Akku schnell Laden
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - states('input_number.akkusteuerung_ladestaerke_soll') | int }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: ""
      - stop: fertig

  - alias: Wenn Akku schnell Entladen
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Entladen"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 0
            - >-
              {{ states('input_number.akkusteuerung_entladestaerke_soll') | int }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: ""
      - stop: fertig

  # --- Standardpfad: Fremdsteuerung aktivieren (immer, kein Write-on-Change) ---
  - data:
      hub: !input modbus_hub
      address: 40151
      slave: 3
      value:
        - 0
        - 803
    action: modbus.write_register
  - delay:
      seconds: 1

  # --- BMS-Wertregister: nur bei Aenderung oder abgelaufenem Keepalive schreiben ---
  - if:
      - condition: template
        value_template: "{{ write_needed }}"
    then:
      - data:
          hub: !input modbus_hub
          address: 40793
          slave: 3
          value:
            - 0
            - "{{ v_40793 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - alias: Schreib die dynamische Ladestärke auf Modbus
        data:
          hub: !input modbus_hub
          address: 40795
          slave: 3
          value:
            - 0
            - "{{ v_40795 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40797
          slave: 3
          value:
            - 0
            - "{{ v_40797 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40799
          slave: 3
          value:
            - 0
            - "{{ v_40799 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40801
          slave: 3
          value:
            - 0
            - 0
        action: modbus.write_register
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "{{ current_snapshot }}"

  - alias: Bei "Akku Pause"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Pause"
    then:
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 303
        action: modbus.write_register

  - alias: Bei "Akku nur Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Laden"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2289
        action: modbus.write_register

  - alias: Bei "Akku Netzladen"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Netzladen"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2289
        action: modbus.write_register

  - alias: Bei "Akku nur Entladen"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Entladen"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2290
        action: modbus.write_register

  - alias: Bei "Akku Dynamisch"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Dynamisch"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 1438
        action: modbus.write_register

  - alias: Bei "Akku 0.2C Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku 0.2C Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      # 0.2C-Ladeleistung = 0,2 × Batterie-Nennkapazität (Wh) → W; kein manueller Helfer nötig.
      # Kapazität nicht verfügbar → 0 → 65535-0=65535 → ~1 W (praktisch null, harmlos).
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - ((0.2 * states(capacity_entity) | float(0)) | round(0) | int) }}
        action: modbus.write_register

mode: single
