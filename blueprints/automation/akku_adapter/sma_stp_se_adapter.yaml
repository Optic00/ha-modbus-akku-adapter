              address: 40151
              slave: 3
              value:
                - 0
                - 803
            action: modbus.write_register
          - stop: "Stale: Modus wechselte waehrend des Delays"
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 0
            - >-
              {{ [[states('input_number.akkusteuerung_entladestaerke_soll') | int(0), 0] | max, 10000] | min }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "CMD|{{ run_modus }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - stop: fertig

  # Nutzt seit v1.5.0 dieselbe 40151/40149-Kommandoschiene wie "Akku schnell
  # Laden" statt CmpBMS.OpMod/BatChaMinW (40793): live getestet (2026-07-03) ignorierte
  # der WR BatChaMinW zunaechst 5,5 Minuten komplett und lud danach mit voller
  # PV-Leistung unter Missachtung von BatChaMaxW, Export brach auf 0 ein. Die
  # 40149-Schiene regelte im selben Test dagegen punktstabil auf den Sollwert.
  # Einziger Unterschied zu "Wenn Akku schnell Laden": die Ladeleistung kommt aus
  # dyn_charge_entity (dynamisches Ziel der Strategie) statt aus dem manuellen
  # input_number-Sollwert.
  - alias: Wenn Akku Netzladen
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Netzladen"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - alias: "Stale-Cleanup: Modus noch Netzladen?"
        if:
          - condition: template
            value_template: "{{ states(mode_select_entity) != 'Akku Netzladen' }}"
        then:
          - data:
              hub: !input modbus_hub
              address: 40151
              slave: 3
              value:
                - 0
                - 803
            action: modbus.write_register
          - stop: "Stale: Modus wechselte waehrend des Delays"
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - ([[states(dyn_charge_entity) | int(0), 0] | max, 10000] | min) }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "CMD|{{ run_modus }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - stop: fertig

  # 0.2C nutzt dieselbe 40151/40149-Kommandoschiene und steht deshalb wie die
  # anderen Kommando-Schienen VOR dem Standardpfad (v1.6.0-Fix): vorher lief er
  # dahinter und jeder unconditional Lauf deaktivierte die Sollwert-Schiene
  # (40151=803) kurz, bevor 802/40149 sie wieder aktivierte.
  - alias: Bei "Akku 0.2C Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku 0.2C Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - alias: "Stale-Cleanup: Modus noch 0.2C Laden?"
        if:
          - condition: template
            value_template: "{{ states(mode_select_entity) != 'Akku 0.2C Laden' }}"
        then:
          - data:
              hub: !input modbus_hub
              address: 40151
              slave: 3
              value:
                - 0
                - 803
            action: modbus.write_register
          - stop: "Stale: Modus wechselte waehrend des Delays"
      # 0.2C-Ladeleistung = 0,2 × Batterie-Nennkapazität (Wh) → W; kein manueller Helfer nötig.
      # Kapazität nicht verfügbar → 0 → 65535-0=65535 → ~1 W (praktisch null, harmlos).
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - ([[(0.2 * states(capacity_entity) | float(0)) | round(0) | int, 0] | max, 10000] | min) }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "CMD|{{ run_modus }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - stop: fertig

  # --- Standardpfad: Fremdsteuerung deaktivieren (Sollwert-Schiene aus), dann
  #     IMMER den vollen BMS-Registersatz schreiben - wie die bewaehrte Legacy-
  #     Automation "Akkusteuerung 2.0" (unconditional, /2-min-Zyklus). Die
  #     Register sind Write-Only-Sollwerte: identisches Wiederschreiben ist
  #     unschaedlich. Delays 500 ms statt 1 s (SMA: kompletter Satz muss
  #     innerhalb von 10 s gesetzt sein - so bleibt mehr Marge).
  #
  #     Reihenfolge (Haertung P2, geprueft und BEWUSST NICHT gedreht,
  #     Adversarial-Review 2026-07-12): 803 zuerst neutralisiert eine evtl.
  #     noch aktive 40149-Vorgabe sofort - beim Exit aus einem Lade-Kommando
  #     ist genau DAS die Restriktion. Danach kommen die Fensterregister, die
  #     seit Haertung P1 in Sperr-Modi bereits restriktiv ([0,0]) sind, und
  #     erst zuletzt das OpMod-Register (Enable). Ein 803 am Sequenz-Ende
  #     wuerde stattdessen den alten Ladebefehl waehrend der gesamten
  #     Schreibsequenz aktiv lassen. Restrisiko der jetzigen Reihenfolge:
  #     zwischen 803 und den Fenster-Writes regelt der WR ~0,5-3 s intern
  #     (kein definierter Sperrzustand) - akzeptiert, weil kurz, und vom
  #     2-min-Reconcile geheilt, falls die Sequenz abbricht. ---
  - data:
      hub: !input modbus_hub
      address: 40151
      slave: 3
      value:
        - 0
        - 803
    action: modbus.write_register
  - delay:
      milliseconds: 500

  - data:
      hub: !input modbus_hub
      address: 40793
      slave: 3
      value:
        - 0
        - "{{ v_40793 }}"
    action: modbus.write_register
  - delay:
      milliseconds: 500
  - alias: Schreib die dynamische Ladestärke auf Modbus
    data:
      hub: !input modbus_hub
      address: 40795
      slave: 3
      value:
        - 0
        - "{{ v_40795 }}"
    action: modbus.write_register
  - delay:
      milliseconds: 500
  - data:
      hub: !input modbus_hub
      address: 40797
      slave: 3
      value:
        - 0
        - "{{ v_40797 }}"
    action: modbus.write_register
  - delay:
      milliseconds: 500
  - data:
      hub: !input modbus_hub
      address: 40799
      slave: 3
      value:
        - 0
        - "{{ v_40799 }}"
    action: modbus.write_register
  - delay:
      milliseconds: 500
  - data:
      hub: !input modbus_hub
      address: 40801
      slave: 3
      value:
        - 0
        - 0
    action: modbus.write_register
  - action: input_datetime.set_datetime
    continue_on_error: true
    target:
      entity_id: "{{ timestamp_helper }}"
    data:
      timestamp: "{{ now().timestamp() }}"
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: "{{ snapshot_helper }}"
    data:
      value: "{{ current_snapshot }}"

  - alias: Bei "Akku Pause"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Pause"
    then:
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 303
        action: modbus.write_register

  - alias: Bei "Akku nur Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Laden"
    then:
      - delay:
          milliseconds: 500
