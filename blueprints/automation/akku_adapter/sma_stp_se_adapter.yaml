        action: modbus.write_register

  - alias: Bei "Akku nur Entladen"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Entladen"
    then:
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2290
        action: modbus.write_register

  - alias: Bei "Akku Dynamisch"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Dynamisch"
    then:
      - delay:
          milliseconds: 500
      # 40236 = SMA-Adresse von CmpBMS.OpMod (41259 = Sunspec-Duplikat).
      # Die Legacy-Automation "Akkusteuerung 2.0" schrieb Dynamisch ueber
      # 40236 und lief damit ein Jahr stabil - wir spiegeln das exakt
      # (Community: kohaku, PV-Forum Thread 206718 S. 23).
      - data:
          hub: !input modbus_hub
          address: 40236
          slave: 3
          value:
            - 0
            - 1438
        action: modbus.write_register


# queued statt single (Haertung P4, Huawei-Befund G3): ein waehrend eines
# Laufs eintreffender Moduswechsel-Trigger geht nicht mehr still verloren,
# sondern laeuft als naechster Voll-Reconcile nach. max: 3 reicht, weil jeder
# Lauf per Stale-Guard nur mit frischem Modus schreibt; verworfene Trigger
# (max_exceeded) heilt der 2-min-Tick.
mode: queued
max: 3
max_exceeded: silent
