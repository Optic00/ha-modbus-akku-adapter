blueprint:
  name: "SMA STP SE – Modbus Akku-Adapter"
  description: >
    Hardware-Adapter: übersetzt den abstrakten Steuer-Modus (Contract) in
    Modbus-Register-Schreibvorgänge für den SMA STP SE Hybrid-Wechselrichter.

    Unterstützte Modi (über den Modus-Select / Contract):
    Automatisch · Schnell Laden · Schnell Entladen · Pause · Nur Laden · Nur Entladen · Dynamisch · 0.2C Laden


    **Voraussetzung:** ein Modbus-TCP-Hub zum WR (siehe `examples/sma_modbus.example.yaml`),
    ein `input_select` mit dem Modus-Vokabular sowie die Sollwert-/SoC-Helfer aus dem
    Contract (`docs/modus-contract.md`). Die Strategie, die den Modus setzt, ist NICHT
    Teil dieses Adapters.
  domain: automation
  author: Optic00
  input:
    modbus_hub:
      name: Modbus Hub Name
      description: >
        Name des Modbus Hubs, wie in sma_modbus.yaml unter `name:` definiert.
        Standard: sma-sr_wr
      default: "sma-sr_wr"
      selector:
        text:

    inverter_status_sensor:
      name: WR Betriebsstatus-Sensor
      description: >
        Sensor für den Betriebsstatus des Wechselrichters.
        Muss den Wert "Ok" liefern wenn der WR betriebsbereit ist.
        Typisch: sensor.sma_stp_se_33003_betriebsstatus
      selector:
        entity:
          domain: sensor

    dynamic_charge_strength_sensor:
      name: Sensor "Dynamische Ladestärke"
      description: >
        Template-Sensor mit der berechneten dynamischen Ladestärke.
        Wird durch sma_templates.yaml bereitgestellt.
      default: sensor.akkusteuerung_dynamische_ladestaerke
      selector:
        entity:
          domain: sensor

    battery_capacity_sensor:
      name: Sensor "Batterie-Nennkapazität"
      description: >
        Sensor mit der Nennkapazität der Batterie in Wh (Modbus-Register 40187).
        Wird für den Modus "Akku 0.2C Laden" gebraucht: die Ladeleistung ergibt
        sich automatisch als 0,2 × Kapazität (z. B. 12800 Wh → 2560 W).
      default: sensor.sma_stp_se_40187_batterie_nennkapazitaet
      selector:
        entity:
          domain: sensor

    mode_select:
      name: "Modus-Select (Akkusteuerung)"
      description: >
        input_select mit dem abstrakten Steuer-Modus (Contract). Dieser Adapter
        liest den Modus und übersetzt ihn in SMA-Modbus-Register.
        Standard: input_select.akkusteuerung_modus
      default: input_select.akkusteuerung_modus
      selector:
        entity:
          domain: input_select

    last_write_value_helper:
      name: "Helfer: Letzter Schreibwert (Write-on-Change)"
      description: >
        input_text-Helfer, der den Snapshot der zuletzt geschriebenen BMS-Wertregister
        speichert (40793/40795/40797/40799/40801). Wird vom Adapter automatisch
        gepflegt, nicht manuell setzen. Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_text.akkusteuerung_modbus_letzter_schreibwert
      selector:
        entity:
          domain: input_text

    last_write_time_helper:
      name: "Helfer: Letzter Schreibzeitpunkt (Write-on-Change)"
      description: >
        input_datetime-Helfer (Datum + Uhrzeit), der den Zeitpunkt des letzten
        tatsächlichen BMS-Register-Schreibvorgangs speichert. Wird vom Adapter
        automatisch gepflegt. Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_datetime.akkusteuerung_modbus_letzter_schreibzeitpunkt
      selector:
        entity:
          domain: input_datetime

    keepalive_seconds:
      name: "Keepalive-Intervall (Sekunden)"
      description: >
        Maximales Intervall, nach dem die BMS-Wertregister (40793-40801) auch ohne
        Wertänderung erneut geschrieben werden (sonst läuft die SMA-Fremdsteuerung
        aus). Hersteller-Limit: 300s. Default 180s lässt Sicherheitsmarge.
      default: 180
      selector:
        number:
          min: 30
          max: 200
          step: 10
          unit_of_measurement: s
          mode: box

variables:
  # !input ist in Jinja nicht direkt verfügbar – erst als Variable exponieren.
  dyn_charge_entity: !input dynamic_charge_strength_sensor
  capacity_entity: !input battery_capacity_sensor
  snapshot_helper: !input last_write_value_helper
  timestamp_helper: !input last_write_time_helper
  keepalive_s: !input keepalive_seconds
  mode_select_entity: !input mode_select
  early_stop_modes: ['Akku Automatisch', 'Akku schnell Laden', 'Akku schnell Entladen']
  v_40793: "{{ [states('input_number.akkusteuerung_min_ladestaerke') | int(0), states(dyn_charge_entity) | int(0)] | min }}"
  v_40795: "{{ states(dyn_charge_entity) | int(0) }}"
  v_40797: "{{ [states('input_number.akkusteuerung_min_entladestaerke') | int(0), states('input_number.akkusteuerung_max_entladestaerke') | int(0)] | min }}"
  v_40799: "{{ states('input_number.akkusteuerung_max_entladestaerke') | int(0) }}"
  current_snapshot: "{{ [v_40793, v_40795, v_40797, v_40799, 0] | join('|') }}"
  write_needed: >-
    {% set valid_dt = state_attr(timestamp_helper, 'has_date') and state_attr(timestamp_helper, 'has_time') %}
    {% set last_ts = as_timestamp(states(timestamp_helper), none) if valid_dt else none %}
    {{ trigger.id == 'ha_start'
       or current_snapshot != states(snapshot_helper)
       or last_ts is none
       or (now().timestamp() - last_ts) > (keepalive_s | int(0)) }}

triggers:
  - entity_id:
      - !input mode_select
      - !input dynamic_charge_strength_sensor   # Drosselung sofort übernehmen, nicht erst beim /4-min-Tick
      - input_number.akkusteuerung_entladestaerke_soll
      - input_number.akkusteuerung_ladestaerke_soll
      - input_number.akkusteuerung_min_ladestaerke
      - input_number.akkusteuerung_min_entladestaerke
      - input_number.akkusteuerung_max_ladestaerke
      - input_number.akkusteuerung_max_entladestaerke
    from: null
    to: null
    for:
      seconds: 2
    trigger: state

  - minutes: /4
    trigger: time_pattern

  - minutes: /1
    trigger: time_pattern
    id: keepalive_check

  - event: start
    trigger: homeassistant
    id: ha_start

conditions:
  - condition: state
    entity_id: !input inverter_status_sensor
    state: "Ok"
  - condition: template
    value_template: >-
      {{ trigger.id != 'keepalive_check'
         or (states(mode_select_entity) not in early_stop_modes and write_needed) }}

actions:
  - alias: Wenn Akku Automatik
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Automatisch"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 803
        action: modbus.write_register
      - stop: ""

  - alias: Wenn Akku schnell Laden
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - states('input_number.akkusteuerung_ladestaerke_soll') | int }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: ""
      - stop: fertig

  - alias: Wenn Akku schnell Entladen
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Entladen"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 0
            - >-
              {{ states('input_number.akkusteuerung_entladestaerke_soll') | int }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: ""
      - stop: fertig

  # --- Standardpfad: Fremdsteuerung aktivieren (immer, kein Write-on-Change) ---
  - data:
      hub: !input modbus_hub
      address: 40151
      slave: 3
      value:
        - 0
        - 803
    action: modbus.write_register
  - delay:
      seconds: 1

  # --- BMS-Wertregister: nur bei Aenderung oder abgelaufenem Keepalive schreiben ---
  - if:
      - condition: template
        value_template: "{{ write_needed }}"
    then:
      - data:
          hub: !input modbus_hub
          address: 40793
          slave: 3
          value:
            - 0
            - "{{ v_40793 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - alias: Schreib die dynamische Ladestärke auf Modbus
        data:
          hub: !input modbus_hub
          address: 40795
          slave: 3
          value:
            - 0
            - "{{ v_40795 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40797
          slave: 3
          value:
            - 0
            - "{{ v_40797 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40799
          slave: 3
          value:
            - 0
            - "{{ v_40799 }}"
        action: modbus.write_register
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40801
          slave: 3
          value:
            - 0
            - 0
        action: modbus.write_register
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "{{ current_snapshot }}"

  - alias: Bei "Akku Pause"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Pause"
    then:
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 303
        action: modbus.write_register

  - alias: Bei "Akku nur Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Laden"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2289
        action: modbus.write_register

  - alias: Bei "Akku nur Entladen"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku nur Entladen"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 2290
        action: modbus.write_register

  - alias: Bei "Akku Dynamisch"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Dynamisch"
    then:
      - delay:
          seconds: 1
      - data:
          hub: !input modbus_hub
          address: 40236
          slave: 3
          value:
            - 0
            - 1438
        action: modbus.write_register

  - alias: Bei "Akku 0.2C Laden"
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku 0.2C Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      # 0.2C-Ladeleistung = 0,2 × Batterie-Nennkapazität (Wh) → W; kein manueller Helfer nötig.
      # Kapazität nicht verfügbar → 0 → 65535-0=65535 → ~1 W (praktisch null, harmlos).
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - ((0.2 * states(capacity_entity) | float(0)) | round(0) | int) }}
        action: modbus.write_register

mode: single
