blueprint:
  name: "SMA STP SE – Modbus Akku-Adapter"
  description: >
    Hardware-Adapter: übersetzt den abstrakten Steuer-Modus (Contract) in
    Modbus-Register-Schreibvorgänge für den SMA STP SE Hybrid-Wechselrichter.

    Unterstützte Modi (über den Modus-Select / Contract):
    Automatisch · Schnell Laden · Schnell Entladen · Pause · Nur Laden · Netzladen · Nur Entladen · Dynamisch · 0.2C Laden


    **Voraussetzung:** ein Modbus-TCP-Hub zum WR (siehe `examples/sma_modbus.example.yaml`),
    ein `input_select` mit dem Modus-Vokabular sowie die Sollwert-/SoC-Helfer aus dem
    Contract (`docs/modus-contract.md`). Die Strategie, die den Modus setzt, ist NICHT
    Teil dieses Adapters.
  domain: automation
  author: Optic00
  input:
    modbus_hub:
      name: Modbus Hub Name
      description: >
        Name des Modbus Hubs, wie in sma_modbus.yaml unter `name:` definiert.
        Standard: sma-sr_wr
      default: "sma-sr_wr"
      selector:
        text:

    inverter_status_sensor:
      name: WR Betriebsstatus-Sensor
      description: >
        Sensor für den Betriebsstatus des Wechselrichters. Der Adapter
        schreibt Register nur, wenn dessen aktueller Wert in
        `inverter_ok_states` steht.

        Empfohlen ist der rohe Modbus-Sensor auf Register 33003, typisch
        sensor.sma_stp_se_33003_betriebsstatus. Der liefert Zahlencodes statt
        Text - dann gehören die bei dir betriebsbereiten Codes als Strings in
        `inverter_ok_states`, z. B. "235" (Netzparallelbetrieb), "1463"
        (Backup), "2119" (Abregelung).

        Der Vorgabewert "Ok" passt nur zu einem Sensor, der genau diesen Text
        liefert - etwa dem Status-Sensor der offiziellen SMA-Integration oder
        einem selbst gebauten Template-Sensor, der die Codes übersetzt. Mit
        dem Rohsensor kombiniert bleibt das Gate dauerhaft zu und der Adapter
        schreibt nie ein Register. Details: README, Abschnitt "Der
        WR-Status-Sensor".
      selector:
        entity:
          domain: sensor

    inverter_ok_states:
      name: "WR-Status: als betriebsbereit akzeptierte Werte"
      description: >
        Liste der Statuswerte von `inverter_status_sensor`, bei denen der
        Adapter Modbus-Register schreibt (inklusive Keepalive). Der
        Vorgabewert "Ok" gilt nur für einen selbst gemappten Text-Sensor. Beim
        empfohlenen Rohsensor auf Register 33003 stehen hier stattdessen die
        Zahlencodes als Strings, z. B. "235", "1463", "2119".

        Nicht aufnehmen: "16777213" (0x00FFFFFD) heißt bei SMA "Information
        liegt nicht vor" und ist keine bestätigte Betriebsbereitschaft. Tritt
        der Wert regelmäßig auf, ist zuerst zu klären, warum der WR seinen
        Status nicht meldet, statt den Wert freizuschalten.

        Achtung: eine zu strenge Liste ist gefährlich. Meldet der WR einen
        Status, der hier fehlt (z. B. "2119" = Abregelung wegen der
        70%-Einspeisebegrenzung, oder einen Code, den ein selbstgebauter
        Mapping-Helfer nicht kennt), blockiert das ALLE Läufe dieser
        Automation, auch den Keepalive. Läuft die SMA-Fremdsteuerung dadurch
        in ihren Timeout, fällt der WR in seinen internen Modus zurück und
        lädt/entlädt eigenmächtig - unabhängig vom gewählten Modus.
        Status-Codes wie Abregelung sollten deshalb mit aufgenommen werden, wenn sie
        im eigenen Setup regelmäßig auftreten.
      default:
        - "Ok"
      selector:
        text:
          multiple: true

    dynamic_charge_strength_sensor:
      name: Sensor "Dynamische Ladestärke"
      description: >
        Template-Sensor mit der berechneten dynamischen Ladestärke, in Watt.
        Kanonischer Name bei Nutzung von ha-opti-akkusteuerung:
        sensor.opti_charge_power_w. Bei eigener Strategie: eigenen Watt-Sensor
        eintragen.
      default: sensor.opti_charge_power_w
      selector:
        entity:
          domain: sensor

    battery_capacity_sensor:
      name: Sensor "Batterie-Nennkapazität"
      description: >
        Sensor mit der Nennkapazität der Batterie in Wh (Modbus-Register 40187).
        Wird für den Modus "Akku 0.2C Laden" gebraucht: die Ladeleistung ergibt
        sich automatisch als 0,2 × Kapazität (z. B. 12800 Wh → 2560 W).
      default: sensor.sma_stp_se_40187_batterie_nennkapazitaet
      selector:
        entity:
          domain: sensor

    mode_select:
      name: "Modus-Select (Akkusteuerung)"
      description: >
        input_select mit dem abstrakten Steuer-Modus (Contract). Dieser Adapter
        liest den Modus und übersetzt ihn in SMA-Modbus-Register.
        Standard: input_select.akkusteuerung_modus
      default: input_select.akkusteuerung_modus
      selector:
        entity:
          domain: input_select

    last_write_value_helper:
      name: "Helfer: Letzter Schreibwert (Diagnose)"
      description: >
        input_text-Helfer, der den Snapshot der zuletzt geschriebenen BMS-Wertregister
        speichert (40793/40795/40797/40799/40801) bzw. in Kommando-/Automatik-Modi
        den Marker "CMD|<Modus>". Seit der Härtung 2026-07 wieder FUNKTIONAL:
        dient als Modus-Tracker für die CmpBMS-Freigabe nach Sperr-Modi.
        Wird automatisch gepflegt, nicht manuell setzen.
        Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_text.akkusteuerung_modbus_letzter_schreibwert
      selector:
        entity:
          domain: input_text

    last_write_time_helper:
      name: "Helfer: Letzter Schreibzeitpunkt (Diagnose)"
      description: >
        input_datetime-Helfer (Datum + Uhrzeit), der den Zeitpunkt des letzten
        BMS-Register-Schreibvorgangs speichert. Seit v1.6.0 reine Diagnose;
        wird automatisch gepflegt. Siehe examples/akkusteuerung_helpers.example.yaml.
      default: input_datetime.akkusteuerung_modbus_letzter_schreibzeitpunkt
      selector:
        entity:
          domain: input_datetime

    keepalive_seconds:
      name: "Keepalive-Intervall (Sekunden) - DEPRECATED, ohne Funktion"
      description: >
        Seit v1.6.0 ohne Funktion: der Adapter schreibt den vollen Registersatz
        bei JEDEM Lauf unconditional (wie die bewährte Legacy-Automation
        "Akkusteuerung 2.0"), der zyklische Trigger läuft alle 2 Minuten und
        hält damit das 300-s-Fenster der SMA-Fremdsteuerung auch dann ein,
        wenn ein einzelner Lauf ausfällt. Der Input bleibt nur deklariert,
        damit bestehende Automationen beim Blueprint-Update nicht brechen.
      default: 180
      selector:
        number:
          min: 30
          max: 200
          step: 10
          unit_of_measurement: s
          mode: box

variables:
  # !input ist in Jinja nicht direkt verfügbar – erst als Variable exponieren.
  inverter_status_entity: !input inverter_status_sensor
  inverter_ok_states: !input inverter_ok_states
  dyn_charge_entity: !input dynamic_charge_strength_sensor
  capacity_entity: !input battery_capacity_sensor
  snapshot_helper: !input last_write_value_helper
  timestamp_helper: !input last_write_time_helper
  mode_select_entity: !input mode_select
  # Beim Trigger eingefrorener Modus (Haertung 2026-07-12, Review-Finding F5):
  # HA rendert diese Top-Level-Variablen beim Ausloesen der Automation; ein
  # queued-Lauf kann danach warten und traegt dann veraltete Fensterwerte.
  # Der Stale-Guard als erste Action vergleicht diesen eingefrorenen Wert mit
  # dem zum Ausfuehrungszeitpunkt aktuellen Modus und verwirft veraltete Laeufe.
  run_modus: "{{ states(mode_select_entity) }}"
  # Der Modus-Tracker fuer die CmpBMS-Freigabe (Haertung F2) wird bewusst NICHT
  # hier als Variable berechnet, sondern zur Ausfuehrungszeit in der Bedingung
  # des Freigabe-Blocks unten: diese Variablen frieren beim Trigger ein, und
  # ein queued-Lauf wuerde sonst die Freigabe unnoetig wiederholen, obwohl der
  # erste Lauf den Tracker laengst auf "CMD|..." gesetzt hat (Codex-Review
  # 2026-07-12, Finding R2).
  # Einschwing-Schutz: nach einem Wechsel IN "Akku Dynamisch" hat der WR beobachtet
  # (2x live reproduziert, 2026-07-01) bis zu ~5 Minuten eine unklare interne
  # Ladeleistungsgrenze (vermutlich Drift auf Maximalwert waehrend "nur Entladen").
  # Deckel die Ladeleistung in diesem Fenster defensiv auf einen sicheren Wert.
  dynamisch_settling_seconds: 330
  dynamisch_settling_cap_w: 500
  dynamisch_settling: >-
    {{ states(mode_select_entity) == 'Akku Dynamisch'
       and (as_timestamp(now()) - as_timestamp(states[mode_select_entity].last_changed)) < dynamisch_settling_seconds }}
  # "Akku Netzladen" nutzt seit v1.5.0 die 40151/40149-Kommandoschiene (Branch
  # "Wenn Akku Netzladen" weiter unten, analog "Wenn Akku schnell Laden") und stoppt
  # dort, bevor diese BMS-Wertregister ueberhaupt erreicht werden - braucht also
  # keine Sonderweiche mehr in der Ladefenster-Berechnung. Live-Befund (2026-07-03):
  # der urspruengliche Ansatz ueber BatChaMinW/40793 wurde vom WR in diesem Kontext
  # nicht befolgt (siehe CHANGELOG v1.5.0 und docs/modbus-register-referenz.md,
  # "Bekannte Probleme & Hinweise").
  #
  # Grenzfenster-Invariante (Review 2026-07-04, gegengeprueft mit unabhaengiger
  # Architektur- und Adversarial-Zweitmeinung): BatChaMinW darf NIE == BatChaMaxW
  # > 0 sein - genau diese Kombination wurde in OpMod 2289 live reproduziert und
  # fuehrte zu unkontrolliertem Volllast-Laden (docs/modbus-register-referenz.md,
  # "Bekannte Probleme & Hinweise"). Fuer Dynamisch (1438) ist das unbelegt, aber
  # nicht ausgeschlossen - deshalb strukturell verhindert statt nur "meistens"
  # vermieden: erst die Obergrenze (Ziel, ggf. Settling-gedeckelt) berechnen, die
  # Untergrenze (Lade-/Entlade-Floor, gegen Tropfenladen bzw. Fehlkonfiguration)
  # nur uebernehmen, wenn sie NACHWEISLICH kleiner als die Obergrenze ist - sonst
  # 0. Liegt das Ziel unter dem Floor, entsteht [0, 0] (diesen Zyklus nicht
  # laden/entladen) statt eines kollabierten [Floor, Floor]-Fensters. Gilt fuer
  # alle Modi, die durch den Standardpfad laufen (Dynamisch, Pause, nur Laden,
  # nur Entladen) - nicht nur fuer Dynamisch, da der Invariantenbruch im
  # Live-Vorfall gerade in "nur Laden" (2289) auftrat.
  # Sperr-Modi (Haertung P1, 2026-07-12, Huawei-Lektion G2): die OpMod-Flags
  # 303/2289/2290 sind am SMA nicht als harte Sperre bewiesen. Als zusaetzliche
  # Verteidigungslinie wird das jeweils verbotene Fenster auf [0, 0] gezwungen
  # statt unconditional positiv geschrieben (Entlade-Sperre via BatDschMaxW=0
  # ist das evcc-"hold"-Muster, Lade-Sperre via BatChaMaxW=0 analog). Achtung:
  # auch die 0-W-Fenster sind am SMA UNBEWIESEN (Gerätetests = Release-Gate;
  # evcc-Issue #18339 zeigt sogar kurze Entlade-Bursts trotz 40799=0) - deshalb
  # bleiben die OpMod-Flags gesetzt und der Waechter-Blueprint ueberwacht die
  # Wirkung. [0, 0] ist von der Grenzfenster-Invariante ausdruecklich erlaubt.
  charge_locked: "{{ run_modus in ['Akku Pause', 'Akku nur Entladen'] }}"
  discharge_locked: "{{ run_modus in ['Akku Pause', 'Akku nur Laden'] }}"
  v_charge_floor: "{{ [states('input_number.akkusteuerung_min_ladestaerke') | int(0), 0] | max }}"
  v_charge_target_raw: "{{ [states(dyn_charge_entity) | int(0), 0] | max }}"
  v_charge_target: "{{ [v_charge_target_raw, dynamisch_settling_cap_w] | min if dynamisch_settling else v_charge_target_raw }}"
  v_40795: "{{ 0 if charge_locked else (0 if v_charge_target < v_charge_floor else v_charge_target) }}"
  v_40793: "{{ v_charge_floor if 0 < v_charge_floor and v_charge_floor < v_40795 else 0 }}"
  v_discharge_floor: "{{ [states('input_number.akkusteuerung_min_entladestaerke') | int(0), 0] | max }}"
  v_discharge_target: "{{ [states('input_number.akkusteuerung_max_entladestaerke') | int(0), 0] | max }}"
  v_40799: "{{ 0 if discharge_locked else (0 if v_discharge_target < v_discharge_floor else v_discharge_target) }}"
  v_40797: "{{ v_discharge_floor if 0 < v_discharge_floor and v_discharge_floor < v_40799 else 0 }}"
  # Snapshot: v1.6.0 machte ihn zur reinen Diagnose (der Adapter schreibt bei
  # jedem Lauf unconditional); seit der Haertung 2026-07 ist das Modus-Feld
  # (letztes Feld) wieder funktional als Tracker fuer die CmpBMS-Freigabe
  # (siehe tracked_modus oben). Die Wertefelder bleiben Diagnose.
  current_snapshot: "{{ [v_40793, v_40795, v_40797, v_40799, 0, run_modus] | join('|') }}"

triggers:
  # Modus-Wechsel und dynamisches Ladeziel ohne Debounce: sofort übernehmen,
  # nicht erst beim /2-min-Tick (Review 2026-07-04 - der 2-s-Debounce unten
  # haette das bei hochfrequenten Sensor-Updates aushebeln koennen).
  - entity_id:
      - !input mode_select
      - !input dynamic_charge_strength_sensor
    from: null
    to: null
    trigger: state

  # Manuelle Soll-/Grenz-Helfer mit 2-s-Debounce (Anti-Flatter beim Slider-Ziehen).
  # akkusteuerung_max_ladestaerke bewusst NICHT hier: wird im Standardpfad nirgends
  # gelesen (Review 2026-07-04 - toter Trigger) - der Lade-Deckel kommt aus
  # dyn_charge_entity, die den Helfer bereits upstream in ha-opti-akkusteuerung
  # einrechnet (packages/opti_derived.yaml).
  - entity_id:
      - input_number.akkusteuerung_entladestaerke_soll
      - input_number.akkusteuerung_ladestaerke_soll
      - input_number.akkusteuerung_min_ladestaerke
      - input_number.akkusteuerung_min_entladestaerke
      - input_number.akkusteuerung_max_entladestaerke
    from: null
    to: null
    for:
      seconds: 2
    trigger: state

  # /2 min statt /4 (Legacy): SMA verlangt zyklische Erneuerung max. alle 300 s.
  # Bei /2 min bleibt das Fenster selbst dann eingehalten, wenn ein einzelner
  # Lauf ausfaellt (Queue-Verwurf oder Status-Gate) - bei /4 min nicht.
  - minutes: /2
    trigger: time_pattern

  - event: start
    trigger: homeassistant
    id: ha_start

conditions:
  # WR-Status-Gate: bewusst konfigurierbar statt hart auf "Ok" verdrahtet.
  # Ein zu strenges Gate hier ist gefaehrlich, weil es ALLE Laeufe blockiert,
  # inklusive Keepalive. Meldet der WR einen Status, der nicht in
  # inverter_ok_states steht (z. B. 2119 = Abregelung wegen der
  # 70%-Einspeisebegrenzung, oder ein Code, den ein eigener Mapping-Helfer
  # nicht kennt), schreibt der Adapter so lange keine Register mehr, bis der
  # Status wieder passt. Bleibt das laenger als das SMA-Keepalive-Fenster so,
  # laeuft die externe Fremdsteuerung in ihren Timeout und der WR faellt in
  # seinen internen Modus zurueck - er laedt/entlaedt dann eigenmaechtig,
  # unabhaengig vom in HA gewaehlten Modus (live reproduziert). Status-Codes
  # wie Abregelung sollten deshalb in inverter_ok_states mit aufgenommen
  # werden, wenn sie im eigenen Setup regelmaessig auftreten.
  - condition: template
    value_template: "{{ states(inverter_status_entity) in inverter_ok_states }}"

actions:
  # Stale-Guard (Haertung P4/F5): die v_*-Fenstervariablen sind beim Trigger
  # eingefroren; ein queued-Lauf kann veraltete Werte tragen. Weicht der
  # aktuelle Modus vom eingefrorenen ab, wird dieser Lauf komplett verworfen,
  # BEVOR irgendein Register geschrieben wird - der durch den Moduswechsel
  # getriggerte Folgelauf (bzw. der 2-min-Tick) uebernimmt mit frischen Werten.
  - alias: "Stale-Guard: Modus unveraendert seit Trigger?"
    condition: template
    value_template: "{{ states(mode_select_entity) == run_modus }}"

  # CmpBMS-Freigabe (Haertung F2): nach einem Sperr-Modus bleiben [0,0]-Fenster
  # und Sperr-OpMod bis zum ~300-s-Timeout im WR stehen, weil die Kommando-
  # und Automatik-Branches die CmpBMS-Familie sonst nicht anfassen. Sie
  # koennten den Kommando-Start blockieren oder verzoegern (Geraeteverhalten
  # unbelegt, Gerätetest offen). Deshalb: beim Eintritt in einen Schienen-Modus
  # aus einem Sperr-Modus (oder unbekanntem Zustand, per Tracker erkannt)
  # einmalig ein offenes Freigabe-Set schreiben - Fenster offen, OpMod 1438.
  # Es verfaellt nach <= 300 s von selbst, falls es nicht erneuert wird.
  - alias: "CmpBMS-Freigabe beim Wechsel Sperr-Modus -> Kommando/Automatik"
    if:
      # Tracker-Auswertung zur AUSFUEHRUNGSZEIT (nicht als eingefrorene
      # Variable): letzter vom Adapter geschriebener Modus aus dem Snapshot-
      # Helfer (Standardpfad "...|<modus>", Schienen-Branches "CMD|<modus>").
      # Leer/unbekannt wird konservativ wie ein Sperr-Modus behandelt: die
      # Freigabe schadet dann nicht und verfaellt nach <= 300 s von selbst.
      - condition: template
        value_template: >-
          {% set rail = ['Akku Automatisch', 'Akku schnell Laden',
                         'Akku schnell Entladen', 'Akku Netzladen',
                         'Akku 0.2C Laden'] %}
          {% set raw = states(snapshot_helper) %}
          {% set tracked = (raw.split('|') | last) if '|' in raw else '' %}
          {{ run_modus in rail
             and tracked not in (rail + ['Akku Dynamisch']) }}
    then:
      - data:
          hub: !input modbus_hub
          address: 40793
          slave: 3
          value:
            - 0
            - 0
        action: modbus.write_register
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 40795
          slave: 3
          value:
            - 0
            - 10000
        action: modbus.write_register
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 40797
          slave: 3
          value:
            - 0
            - 0
        action: modbus.write_register
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 40799
          slave: 3
          value:
            - 0
            - 10000
        action: modbus.write_register
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 40801
          slave: 3
          value:
            - 0
            - 0
        action: modbus.write_register
      - delay:
          milliseconds: 500
      - data:
          hub: !input modbus_hub
          address: 41259
          slave: 3
          value:
            - 0
            - 1438
        action: modbus.write_register
      - delay:
          milliseconds: 500

  # Zweiter Stale-Guard (Codex-Reviews 2026-07-12, Findings R1 + S1): kippt
  # der Modus WAEHREND der ~3-s-Freigabesequenz zurueck, wuerden die
  # Schienen-Branches (frischer Modus-Read) uebersprungen und der Standardpfad
  # schriebe die eingefrorenen POSITIVEN Fensterwerte des Kommando-Modus unter
  # dem frischen Sperr-OpMod. Deshalb hier erneut pruefen. Ein nackter Abbruch
  # reicht aber nicht (S1): wurde der Moduswechsel-Trigger wegen voller Queue
  # verworfen (max_exceeded), bliebe das soeben geschriebene OFFENE
  # Freigabe-Set bis zum 2-min-Tick stehen. Ist der frische Modus ein
  # Sperr-Modus, wird deshalb vor dem Stop ein konservatives Sperr-Set
  # geschrieben: beide Fenster [0,0] (bei "nur Laden"/"nur Entladen" bewusst
  # ueber-sperrend - sicherer Fehlerzustand, der naechste Tick schreibt die
  # korrekten Werte) plus das OpMod des frischen Modus. 40151/802 wurde noch
  # nicht aktiviert, die Kommandoschiene braucht kein Cleanup.
  - alias: "Stale-Guard 2: Modus nach CmpBMS-Freigabe unveraendert?"
    if:
      - condition: template
        value_template: "{{ states(mode_select_entity) != run_modus }}"
    then:
      - alias: "Sperr-Cleanup: frischer Modus ist Sperr-Modus"
        if:
          - condition: template
            value_template: >-
              {{ states(mode_select_entity) in
                 ['Akku Pause', 'Akku nur Laden', 'Akku nur Entladen'] }}
        then:
          - data:
              hub: !input modbus_hub
              address: 40793
              slave: 3
              value:
                - 0
                - 0
            action: modbus.write_register
          - delay:
              milliseconds: 500
          - data:
              hub: !input modbus_hub
              address: 40795
              slave: 3
              value:
                - 0
                - 0
            action: modbus.write_register
          - delay:
              milliseconds: 500
          - data:
              hub: !input modbus_hub
              address: 40797
              slave: 3
              value:
                - 0
                - 0
            action: modbus.write_register
          - delay:
              milliseconds: 500
          - data:
              hub: !input modbus_hub
              address: 40799
              slave: 3
              value:
                - 0
                - 0
            action: modbus.write_register
          - delay:
              milliseconds: 500
          - data:
              hub: !input modbus_hub
              address: 40801
              slave: 3
              value:
                - 0
                - 0
            action: modbus.write_register
          - delay:
              milliseconds: 500
          - data:
              hub: !input modbus_hub
              address: 41259
              slave: 3
              value:
                - 0
                - >-
                  {{ {'Akku Pause': 303,
                      'Akku nur Laden': 2289,
                      'Akku nur Entladen': 2290}.get(states(mode_select_entity), 303) }}
            action: modbus.write_register
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ snapshot_helper }}"
            data:
              value: "0|0|0|0|0|{{ states(mode_select_entity) }}"
          - action: input_datetime.set_datetime
            continue_on_error: true
            target:
              entity_id: "{{ timestamp_helper }}"
            data:
              timestamp: "{{ now().timestamp() }}"
      - stop: "Stale: Modus wechselte waehrend der CmpBMS-Freigabe"

  - alias: Wenn Akku Automatik
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku Automatisch"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 803
        action: modbus.write_register
      # Tracker + Zeitstempel (Haertung F2/F6): auch Schienen-Branches pflegen
      # den Modus-Tracker und den Schreibzeitpunkt, sonst meldet der Waechter
      # faelschlich Stillstand und die CmpBMS-Freigabe kennt den Vorzustand nicht.
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "CMD|{{ run_modus }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - stop: ""

  - alias: Wenn Akku schnell Laden
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Laden"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
          seconds: 2
      # Stale-Cleanup (Haertung P4/F4): der Modus kann sich waehrend des Delays
      # geaendert haben. Dann NICHT einfach abbrechen (das liesse die soeben
      # aktivierte 802-Schiene mit altem Sollwert stehen), sondern die Schiene
      # explizit deaktivieren und stoppen - der Folgelauf setzt den neuen Modus.
      - alias: "Stale-Cleanup: Modus noch schnell Laden?"
        if:
          - condition: template
            value_template: "{{ states(mode_select_entity) != 'Akku schnell Laden' }}"
        then:
          - data:
              hub: !input modbus_hub
              address: 40151
              slave: 3
              value:
                - 0
                - 803
            action: modbus.write_register
          - stop: "Stale: Modus wechselte waehrend des Delays"
      # Klemmung 0..10000 W (Review-Befund 2026-07-09): verhindert ungueltige
      # 16-Bit-Woerter bei defektem Upstream-Sensor/Helfer (STP SE 10.0 = 10 kW).
      - data:
          hub: !input modbus_hub
          address: 40149
          slave: 3
          value:
            - 65535
            - >-
              {{ 65535 - ([[states('input_number.akkusteuerung_ladestaerke_soll') | int(0), 0] | max, 10000] | min) }}
        action: modbus.write_register
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ snapshot_helper }}"
        data:
          value: "CMD|{{ run_modus }}"
      - action: input_datetime.set_datetime
        continue_on_error: true
        target:
          entity_id: "{{ timestamp_helper }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - stop: fertig

  - alias: Wenn Akku schnell Entladen
    if:
      - condition: state
        entity_id: !input mode_select
        state: "Akku schnell Entladen"
    then:
      - data:
          hub: !input modbus_hub
          address: 40151
          slave: 3
          value:
            - 0
            - 802
        action: modbus.write_register
      - delay:
