# =============================================================================
# Helfer (Helpers) für den SMA STP SE Akku-Adapter
# =============================================================================
# Diese Helfer bilden den "Modus-Contract" ab, den der Adapter-Blueprint liest.
# Ohne sie funktioniert das Blueprint NICHT.
#
# Einbinden: Inhalt nach configuration.yaml kopieren (oder in ein Package legen)
# und Home Assistant neu starten. Danach existieren das Dropdown
# `input_select.akkusteuerung_modus` und die `input_number.*`-Helfer.
#
# Alternativ lassen sich dieselben Helfer über die UI anlegen:
#   Einstellungen → Geräte & Dienste → Helfer → Helfer erstellen
#   (Dropdown = "Auswahl", Leistungswerte = "Zahl"). Wichtig: die Namen müssen
#   die unten gezeigten entity_ids ergeben und die Dropdown-Optionen EXAKT
#   (Groß-/Kleinschreibung, Leerzeichen) übereinstimmen.
# =============================================================================

input_select:
  # Das zentrale Steuer-Dropdown ("Modus-Contract"). Die Strategie setzt es,
  # der Adapter liest es. Die 9 Optionen müssen GENAU so heißen:
  #
  # ACHTUNG - bewusst KEIN `initial:` (Fix 2026-07-18): `initial:` überschreibt
  # bei JEDEM Home-Assistant-Neustart den wiederhergestellten Modus. Mit
  # `initial: Akku Automatisch` gab der Adapter den WR nach jedem Restart kurz
  # in seine interne Eigenverbrauchsregelung frei - der lud dann ~30-60 s mit
  # voller PV-Leistung über der dynamischen Soll-Ladestärke, bis die Strategie
  # den Modus zurücksetzte (live belegt, mehrere Anlagen). Ohne `initial:`
  # restauriert HA beim Neustart einfach den letzten Modus.
  # Bestandsnutzer: prüft euren vorhandenen Helfer! Bei YAML-Helfern die Zeile
  # `initial:` entfernen; bei UI-Helfern steht sie ggf. in
  # /config/.storage/input_select ("initial": "Akku Automatisch" -> entfernen).
  akkusteuerung_modus:
    name: Akkusteuerung Modus
    icon: mdi:battery-charging
    options:
      - Akku Automatisch       # WR-Eigenregelung / Standard
      - Akku Dynamisch         # Adapter regelt auf Ziel (SoC/Leistungsgrenzen)
      - Akku Pause             # weder laden noch entladen
      - Akku nur Laden         # Entladen gesperrt
      - Akku Netzladen         # Entladen gesperrt + erzwungenes dynamisches Laden aus dem Netz
      - Akku nur Entladen      # Laden gesperrt
      - Akku schnell Laden     # erzwungenes Laden mit "Ladestärke Soll"
      - Akku schnell Entladen  # erzwungenes Entladen mit "Entladestärke Soll"
      - Akku 0.2C Laden        # Preset: 0,2 × Kapazität, automatisch (kein Helfer nötig)

input_text:
  # Speichert den Snapshot der zuletzt geschriebenen BMS-Wertregister bzw.
  # "CMD|<Modus>" in Kommando-/Automatik-Modi (ab v1.2.0; v1.6.0 rein
  # informativ, seit Haertung 2026-07 wieder FUNKTIONAL als Modus-Tracker
  # fuer die CmpBMS-Freigabe). Wird vom Adapter automatisch gepflegt,
  # nicht manuell befuellen.
  akkusteuerung_modbus_letzter_schreibwert:
    name: Akkusteuerung Modbus Letzter Schreibwert
    max: 255

input_datetime:
  # Zeitpunkt des letzten tatsaechlichen Register-Schreibvorgangs, seit
  # Haertung 2026-07 in ALLEN Modus-Branches gepflegt und Datenquelle der
  # Stillstands-Erkennung im Waechter-Blueprint. Wird vom Adapter
  # automatisch gepflegt.
  akkusteuerung_modbus_letzter_schreibzeitpunkt:
    name: Akkusteuerung Modbus Letzter Schreibzeitpunkt
    has_date: true
    has_time: true

input_number:
  # Alle Werte in WATT. Grenzen/Step nach eigener Anlage anpassen.
  akkusteuerung_ladestaerke_soll:        # für "Akku schnell Laden"
    name: Ladestärke Soll
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_entladestaerke_soll:     # für "Akku schnell Entladen"
    name: Entladestärke Soll
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

  # Hinweis: Für "Akku 0.2C Laden" ist KEIN Helfer nötig – der Adapter berechnet
  # die Leistung automatisch als 0,2 × Batterie-Nennkapazität (Modbus-Register 40187).

  akkusteuerung_min_ladestaerke:         # Untergrenze Laden (Standardpfad)
    name: Min Ladestärke
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_ladestaerke:         # Obergrenze Laden
    name: Max Ladestärke
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_min_entladestaerke:      # Untergrenze Entladen
    name: Min Entladestärke
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

  akkusteuerung_max_entladestaerke:      # Obergrenze Entladen
    name: Max Entladestärke
    min: 0
    max: 11000
    step: 50
    unit_of_measurement: W
    mode: box

# =============================================================================
# Zusätzlich vom Blueprint erwartet (NICHT in dieser Datei, weil anlagen-/
# strategieabhängig):
#
# 1) Sensor "Dynamische Ladestärke" (Watt)
#    Blueprint-Default: sensor.opti_charge_power_w
#    Liefert die gewünschte Ladeleistung. Kommt von deiner STRATEGIE – z. B. aus
#    dem Schwesterprojekt ha-opti-akkusteuerung – oder du baust einen eigenen
#    (Template-)Sensor, der schlicht eine Watt-Zahl ausgibt.
#
# 2) WR-Betriebsstatus-Sensor für das Schreib-Gate des Blueprints.
#    Empfohlen (kein Template nötig): den rohen Modbus-Sensor auf Register
#    33003 direkt als "WR Betriebsstatus-Sensor" auswählen. Er liefert
#    Zahlencodes; die bei dir betriebsbereiten Codes gehören dann als Strings
#    in den Blueprint-Input "WR-Status: als betriebsbereit akzeptierte Werte",
#    z. B. "235" (Netzparallelbetrieb), "1463" (Backup), "2119" (Abregelung).
#    Der Blueprint-Vorgabewert "Ok" passt NICHT zu diesem Rohsensor - bleibt er
#    stehen, schreibt der Adapter nie ein Register.
#
#    Alternative: einen Template-Sensor bauen, der die Codes nach Text
#    übersetzt, und dann "Ok" als akzeptierten Wert stehen lassen:
#
#    template:
#      - sensor:
#          - name: SMA WR Status
#            state: >
#              {% set s = states('sensor.sma_stp_se_33003_betriebsstatus') | int(0) %}
#              {{ 'Ok' if s in [235, 1463] else 'nicht bereit' }}
#
#    Achtung bei dieser Variante: jeder Code, den die Vorlage NICHT nach "Ok"
#    übersetzt, blockiert alle Adapter-Läufe inklusive Keepalive. Siehe
#    README, Abschnitt "Der WR-Status-Sensor".
# =============================================================================
