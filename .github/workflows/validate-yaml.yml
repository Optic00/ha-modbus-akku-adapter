name: Validate YAML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml jinja2 pytest

      - name: Validate blueprint YAML (permissive !input tag)
        run: |
          python3 <<'PYEOF'
          import sys
          import glob
          import yaml

          def input_constructor(loader, node):
              return f"!input {node.value}"

          yaml.add_constructor("!input", input_constructor, Loader=yaml.SafeLoader)

          failed = False
          for path in sorted(glob.glob("blueprints/**/*.yaml", recursive=True)):
              try:
                  with open(path) as f:
                      yaml.safe_load(f)
                  print(f"OK   {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True

          sys.exit(1 if failed else 0)
          PYEOF

      - name: Run blueprint tests (Jinja-Fenster-Variablen + Struktur)
        run: python3 -m pytest tests/ -v

      - name: Validate example/config YAML (plain)
        run: |
          python3 <<'PYEOF'
          import sys
          import glob
          import yaml

          failed = False
          for path in sorted(glob.glob("examples/**/*.yaml", recursive=True)):
              try:
                  with open(path) as f:
                      yaml.safe_load(f)
                  print(f"OK   {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True

          sys.exit(1 if failed else 0)
          PYEOF
